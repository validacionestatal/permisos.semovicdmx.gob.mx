    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f3f5f7 0%, #eaeef2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -8px rgba(0,20,40,0.15), 0 8px 12px -6px rgba(0,0,0,0.02);
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-img {
            width: 180px;
            height: auto;
        }

        .logo-img img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .gov-path {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem 0.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e3a5f;
            background: #f0f4fa;
            padding: 0.7rem 1.4rem;
            border-radius: 100px;
            border: 1px solid #ccd9e2;
        }

        .gov-path span {
            color: #2c5f7e;
            font-weight: 600;
        }

        .separator {
            color: #7b98aa;
            margin: 0 0.15rem;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #dbe3ea;
            padding-bottom: 1.2rem;
            margin-bottom: 1.8rem;
            gap: 0.8rem;
        }

        .nav-item {
            color: #0b3b4b;
            font-size: 1.05rem;
            font-weight: 550;
            text-decoration: none;
            padding: 0.25rem 0;
            border-bottom: 3px solid transparent;
            transition: 0.1s ease;
        }

        .nav-item:hover {
            border-bottom-color: #1c5a4b;
            color: #0e3a30;
        }

        .hero-image-container {
            width: 100%;
            margin: 1.8rem 0 2rem 0;
            border-radius: 16px;
            overflow: hidden;
            background: #eef3f7;
            border: 1px solid #d0dfe6;
            aspect-ratio: 16/9;
        }

        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .title-container {
            background-color: #1c5a4b;
            padding: 0.7rem 1.2rem;
            margin-bottom: 2rem;
            display: inline-block;
            width: auto;
            min-width: 100%;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.2;
            color: white;
            text-align: center;
        }

        .folio-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1f4e5f;
            display: block;
            margin-bottom: 0.6rem;
            margin-left: 0.2rem;
        }

        .consultar-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
            margin-top: 0.25rem;
            margin-bottom: 1.5rem;
        }

        .input-folio {
            flex: 1 1 240px;
            padding: 0.9rem 1.4rem;
            font-size: 1.1rem;
            border: 2px solid #b7ccd6;
            border-radius: 60px;
            outline: none;
            background: white;
            transition: 0.2s;
            color: #0b2e3a;
        }

        .input-folio:focus {
            border-color: #1c5a4b;
            box-shadow: 0 0 0 4px rgba(28, 90, 75, 0.1);
        }

        .btn-consultar {
            background: #1c5a4b;
            color: white;
            border: none;
            padding: 0.9rem 2.4rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 14px rgba(28, 90, 75, 0.25);
        }

        .btn-consultar:hover {
            background: #0e3a30;
            transform: scale(0.98);
        }

        .footer-image-container {
            width: 100%;
            margin-top: 2rem;
            border-radius: 16px;
            overflow: hidden;
            background: #f0f4fa;
            border: 1px solid #d0dfe6;
        }

        .footer-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .gov-footer {
            margin-top: 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #34626c;
            border-top: 1px solid #cbd8e0;
            padding-top: 1.5rem;
            font-size: 0.85rem;
        }

        .cdmx-badge {
            background: #e7edf1;
            padding: 0.3rem 1rem;
            border-radius: 50px;
            font-weight: 600;
            color: #0a4455;
        }

        /* MODAL - VENTANA EMERGENTE */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            overflow-y: auto;
        }

        .modal-content {
            background-color: #fefefe;
            margin: 30px auto;
            padding: 0;
            width: 90%;
            max-width: 900px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: modalFadeIn 0.3s ease;
            position: relative;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.8rem;
            background: #1c5a4b;
            border-radius: 24px 24px 0 0;
            color: white;
        }

        .modal-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .close-modal {
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
            transition: 0.2s;
        }

        .close-modal:hover {
            transform: scale(1.2);
        }

        .permiso-body {
            padding: 2rem;
        }

        /* ESTILOS DEL PERMISO - IGUAL AL DOCUMENTO OFICIAL */
        .permiso-documento {
            font-family: 'Courier New', 'Times New Roman', monospace;
            background: white;
            border: 2px solid #1c5a4b;
            padding: 1.8rem;
            border-radius: 16px;
        }

        .permiso-header {
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px dashed #ccc;
            padding-bottom: 1rem;
        }

        .permiso-folio {
            font-size: 0.9rem;
            color: #555;
            margin-top: 0.5rem;
        }

        .permiso-titulo {
            font-size: 1.6rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #1c5a4b;
            margin: 0.5rem 0;
        }

        .permiso-subtitulo {
            font-size: 0.8rem;
            color: #666;
            font-style: italic;
        }

        .permiso-aviso {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 0.8rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            margin: 1rem 0;
            border-radius: 8px;
        }

        .permiso-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .permiso-campo {
            border-bottom: 1px solid #ddd;
            padding: 0.5rem 0;
        }

        .campo-etiqueta {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 1px;
        }

        .campo-valor {
            font-size: 1rem;
            font-weight: 600;
            color: #1a1a2e;
            margin-top: 0.2rem;
        }

        .permiso-footer {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #ccc;
            font-size: 0.7rem;
            text-align: center;
            color: #666;
        }

        .firma-area {
            margin-top: 1.5rem;
            text-align: center;
            border-top: 1px dashed #ccc;
            padding-top: 1rem;
        }

        .qr-area {
            text-align: center;
            margin-top: 1rem;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.7rem;
        }

        @media (max-width: 600px) {
            .permiso-grid {
                grid-template-columns: 1fr;
            }
            .modal-content {
                margin: 15px auto;
                width: 95%;
            }
            .permiso-body {
                padding: 1rem;
            }
            .section-title {
                font-size: 1.2rem;
                white-space: normal;
            }
        }
    </style>
</head>

                        IMPUESTO POR DERECHO DE AUTOMOVIL Y MOTOCICLETAS (PERMISO PARA CIRCULAR 30 DÍAS)
                    </div>

                    <div class="permiso-grid" style="margin-top:1rem;">
                        <div class="permiso-campo">
                            <div class="campo-etiqueta">REFERENCIA</div>
                            <div class="campo-valor">${permiso.pagoReferencia}</div>
                        </div>
                        <div class="permiso-campo">
                            <div class="campo-etiqueta">MONTO PAGADO</div>
                            <div class="campo-valor">${permiso.pagoMonto}</div>
                        </div>
                        <div class="permiso-campo">
                            <div class="campo-etiqueta">FECHA DE PAGO</div>
                            <div class="campo-valor">${permiso.pagoFecha}</div>
                        </div>
                        <div class="permiso-campo">
                            <div class="campo-etiqueta">TARJETA</div>
                            <div class="campo-valor">${permiso.pagoTarjeta}</div>
                        </div>
                        <div class="permiso-campo">
                            <div class="campo-etiqueta">LÍNEA DE CAPTURA</div>
                            <div class="campo-valor" style="font-size:0.85rem; word-break:break-all;">${permiso.lineaCaptura}</div>
                        </div>
                        <div class="permiso-campo">
                            <div class="campo-etiqueta">CERTIFICACIÓN DIGITAL</div>
                            <div class="campo-valor" style="font-size:0.75rem; word-break:break-all;">${permiso.certificacion}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function buscarFolio() {
            const input = document.getElementById('folio');
            let folio = input.value.trim();
            
            if (folio.length === 0) {
                alert('⚠️ Por favor ingrese un folio para consultar');
                return;
            }
            
            // Búsqueda exacta (insensible a mayúsculas/minúsculas)
            const permiso = permisosDB.find(p => p.folio.toLowerCase() === folio.toLowerCase());
            
            if (permiso) {
                // Generar el contenido del permiso y mostrarlo en el modal
                const permisoBody = document.getElementById('permisoBody');
                permisoBody.innerHTML = generarHTMLPermiso(permiso);
                
                // Mostrar el modal
                const modal = document.getElementById('permisoModal');
                modal.style.display = 'block';
                
                // Prevenir scroll del body cuando el modal está abierto
                document.body.style.overflow = 'hidden';
            } else {
                alert(`❌ Folio "${folio}" no encontrado en la base de datos`);
            }
        }

        function cerrarModal() {
            const modal = document.getElementById('permisoModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Permitir búsqueda con tecla Enter
        document.getElementById('folio').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarFolio();
            }
        });

        // Cerrar modal al hacer clic fuera del contenido
        window.onclick = function(event) {
            const modal = document.getElementById('permisoModal');
            if (event.target === modal) {
                cerrarModal();
            }
        }

        // Enfocar el input al cargar
        window.onload = function() {
            document.getElementById('folio').focus();
        };
    </script>
</body>
</html>
